{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}登录 · 针灸预约系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-shell">
  <div class="auth-frame">
    <aside class="auth-visual">
      <div class="brand" style="color:#fff">
        <span class="brand-mark">针</span>
        <span>
          <span class="brand-title" style="color:#fff">针灸预约系统</span>
          <span class="brand-sub" style="color:rgba(234,244,240,.6)">中医针灸门诊</span>
        </span>
      </div>
      <h1>针灸门诊<br>预约与治疗记录管理</h1>
      <p class="lead">患者预约、医师排班、辨证取穴、治疗登记与记录审核，均在系统内完成。</p>
      <div class="auth-features">
        <div class="auth-feature"><i class="bi bi-calendar2-check"></i><span>按医师与出诊时段预约，余量与重复预约自动校验</span></div>
        <div class="auth-feature"><i class="bi bi-journal-medical"></i><span>治疗方案与治疗记录电子归档，可随时查阅</span></div>
        <div class="auth-feature"><i class="bi bi-shield-check"></i><span>按角色划分操作权限，患者信息按需脱敏</span></div>
      </div>
    </aside>
    <main class="auth-form-wrap">
      {% block form %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
