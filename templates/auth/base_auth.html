{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}登录 · 针灸预约系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-shell">
  <div class="auth-frame">
    <aside class="auth-visual">
      <div class="brand" style="color:#fff">
        <span class="brand-mark">针</span>
        <span>
          <span class="brand-title" style="color:#fff">针灸预约系统</span>
          <span class="brand-sub" style="color:rgba(234,244,240,.6)">Acupuncture Care</span>
        </span>
      </div>
      <h1>让每一次针灸治疗<br>都有迹可循</h1>
      <p class="lead">预约排班、辨证取穴、治疗记录与疗程统计一体化管理，服务个体诊所、医院针灸科与高校实训教学。</p>
      <div class="auth-features">
        <div class="auth-feature"><i class="bi bi-calendar2-check"></i><span>在线预约与号源冲突校验，避免重复约号</span></div>
        <div class="auth-feature"><i class="bi bi-journal-medical"></i><span>治疗记录电子化归档，支持长期追溯</span></div>
        <div class="auth-feature"><i class="bi bi-shield-check"></i><span>RBAC 角色隔离与敏感字段脱敏保护</span></div>
      </div>
      <div class="mt-5" style="font-size:.72rem;color:rgba(234,244,240,.45);letter-spacing:.14em">
        ACUPUNCTURE RESERVATION &amp; TREATMENT RECORD SYSTEM
      </div>
    </aside>
    <main class="auth-form-wrap">
      {% block form %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
